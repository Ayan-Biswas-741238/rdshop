<style>
  body { 
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
    margin: 0; 
    padding: 0;
    background: #f4f7f6;
    color: #333;
  }
  
  /* Navbar Styling */
  .navbar {
    background-color: #007bff;
    overflow: hidden;
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
  }
  .navbar a {
    float: left;
    display: block;
    color: white;
    text-align: center;
    padding: 14px 20px;
    text-decoration: none;
    font-weight: bold;
    transition: 0.3s;
  }
  .navbar a:hover {
    background-color: #0056b3;
  }

  .main-content { padding: 20px; max-width: 900px; margin: auto; }
  
  /* Page Toggling Classes */
  .page-section { display: none; animation: fadeIn 0.5s; }
  .active-page { display: block; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .section { 
    border: 1px solid #ddd; padding: 20px; margin-bottom: 20px; 
    border-radius: 8px; background: #fff; box-shadow: 0 4px 6px rgba(0,0,0,0.05);
  }
  .center-text { text-align: center; }
  .header-flex { display: flex; justify-content: space-between; align-items: center; }
  
  input, textarea, button { 
    padding: 12px; margin: 8px 0; width: 100%; box-sizing: border-box; 
    border-radius: 4px; border: 1px solid #ccc; font-family: inherit;
  }
  button, .btn-email { 
    background-color: #007bff; color: white; border: none; cursor: pointer; 
    font-weight: bold; transition: 0.3s; display: inline-block; text-decoration: none;
  }
  button:hover, .btn-email:hover { background-color: #0056b3; }
  .btn-email { padding: 12px 24px; margin-top: 15px; }

  /* Responsive Video Container */
  .video-container {
    position: relative;
    padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
    height: 0;
    overflow: hidden;
    border-radius: 8px;
    box-shadow: 0 4px 8px rgba(0,0,0,0.1);
  }
  .video-container iframe {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%; border: none;
  }
  
  /* Table Styling */
  .table-responsive { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 14px; }
  th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
  th { background-color: #343a40; color: white; }
  
  /* Status Buttons */
  .btn-approve { background-color: #28a745; padding: 6px; font-size: 12px; color: white; border-radius: 4px; margin-bottom:4px;}
  .btn-reject { background-color: #dc3545; padding: 6px; font-size: 12px; color: white; border-radius: 4px;}
  .btn-logout { background-color: #6c757d; width: auto; padding: 8px 20px; }
  
  .status-pending { color: #d39e00; font-weight: bold; background: #fff3cd; padding: 4px 8px; border-radius: 4px; }
  .status-approved { color: #155724; font-weight: bold; background: #d4edda; padding: 4px 8px; border-radius: 4px; }
  .status-rejected { color: #721c24; font-weight: bold; background: #f8d7da; padding: 4px 8px; border-radius: 4px; }

  .error-msg { color: red; font-weight: bold; }
  .success-msg { color: green; font-weight: bold; }
  .info-msg { color: blue; font-weight: bold; }
</style>
